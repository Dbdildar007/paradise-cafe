name: CI/CD

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Distribution target environment (approval gates are configured per environment)
        type: choice
        options: [staging, production]
        default: staging
      platform:
        description: Platforms to build
        type: choice
        options: [both, android, ios]
        default: both
      distribute:
        description: Distribute to internal testers after E2E passes (requires environment approval)
        type: boolean
        default: false

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  MAESTRO_VERSION: "1.39.13"
  BUILD_NUMBER: ${{ github.run_number }}
  # Never print secrets: GitHub masks them, and every step receives only the secrets it needs.

jobs:
  # ───────────────────────── JOB 1 · SAST & quality gates ─────────────────────────
  quality:
    name: SAST & quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }

      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }

      - name: Install (lockfile only, scripts reviewed via postinstall-check)
        run: npm ci --no-audit --no-fund

      - name: Dependency review (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }

      - name: npm audit (production deps, high+)
        run: npm run audit:prod

      - name: Snyk (optional, runs when SNYK_TOKEN is configured)
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}" }
        run: |
          if [ -n "$SNYK_TOKEN" ]; then npx --yes snyk@1 test --severity-threshold=high; else echo "SNYK_TOKEN not set - skipped"; fi

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

      - name: Import check (no missing files / packages)
        run: npm run check:imports

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint (security rules, zero warnings)
        run: npm run lint

      - name: Unit & component tests + coverage thresholds
        run: npm run test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/lcov.info, retention-days: 7 }

  # ───────────────────────── JOB 1b · Backend tests (Supabase SQL + Edge Functions) ─────────────────────────
  backend-tests:
    name: Backend tests (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Edge Functions - type-check
        run: deno check --config supabase/functions/deno.json supabase/functions/otp-guard/index.ts supabase/functions/auth-sync/index.ts
      - name: Edge Functions - unit tests
        run: deno test --config supabase/functions/deno.json supabase/functions
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: SQL - syntax + migrations executed on a real PostgreSQL (RLS, OTP guard, auth sync assertions)
        run: |
          pip install pglast pgserver "psycopg[binary]"
          python - <<'PY'
          import glob, pglast
          for f in sorted(glob.glob("supabase/migrations/*.sql")) + ["supabase/seed.sql"]:
              sql = open(f).read(); pglast.parse_sql(sql); pglast.parse_plpgsql(sql)
          print("SQL syntax OK")
          PY
          python supabase/tests/run_local_db_tests.py

  # ───────────────────────── JOB 2a · Android build & sign ─────────────────────────
  build-android:
    name: Build & sign Android
    needs: [quality, backend-tests]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.platform != 'ios') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: build-signing        # holds signing secrets; no reviewers (PR speed)
    permissions: { contents: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@v4          # Gradle + wrapper + dependency caching
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }

      - run: npm ci --no-audit --no-fund
      - name: Block release builds with placeholder certificate pins
        run: npm run verify:pins

      - name: Decode keystore (kept in RUNNER_TEMP, never in the workspace)
        env: { ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Inject Firebase config (google-services.json is not stored in git)
        env: { GOOGLE_SERVICES_JSON_BASE64: "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" }
        run: |
          umask 077
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Fastlane build_release (Hermes bytecode + R8 + signing)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: bundle exec fastlane android build_release

      - name: Verify Hermes bytecode & no console strings
        run: bash scripts/verify-hermes-bytecode.sh android/app/build/outputs/bundle/release/app-release.aab

      - name: Remove keystore and Firebase config
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/release.keystore" 2>/dev/null || rm -f "$RUNNER_TEMP/release.keystore"
          rm -f android/app/google-services.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with: { subject-path: android/app/build/outputs/bundle/release/app-release.aab }

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 7
          if-no-files-found: error

  # ───────────────────────── JOB 2b · iOS build & sign (parallel) ─────────────────────────
  build-ios:
    name: Build & sign iOS
    needs: [quality, backend-tests]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.platform != 'android') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-14
    timeout-minutes: 60
    environment: build-signing
    permissions: { contents: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - run: npm ci --no-audit --no-fund
      - run: npm run verify:pins
      - run: cd ios && bundle exec pod install --deployment

      - name: Import certificate & provisioning profile into a temporary keychain
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/cert.p12"; PROFILE="$RUNNER_TEMP/profile.mobileprovision"; KC="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT"
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
          security list-keychain -d user -s "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE")")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$PROFILE")")
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "IOS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$CERT" "$PROFILE"

      - name: Inject Firebase config (GoogleService-Info.plist is not stored in git)
        env: { GOOGLE_SERVICE_INFO_PLIST_BASE64: "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" }
        run: |
          umask 077
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/ParadiseCafe/GoogleService-Info.plist

      - name: Fastlane build_release
        env: { NODE_ENV: production }
        run: bundle exec fastlane ios build_release

      - name: Verify Hermes bytecode
        run: |
          JS=$(find ios/build -name 'main.jsbundle' | head -n1 || true)
          if [ -z "$JS" ]; then unzip -q -o ios/build/ParadiseCafe.ipa -d "$RUNNER_TEMP/ipa" && JS=$(find "$RUNNER_TEMP/ipa" -name main.jsbundle | head -n1); fi
          bash scripts/verify-hermes-bytecode.sh "$JS"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -f ios/ParadiseCafe/GoogleService-Info.plist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with: { subject-path: ios/build/ParadiseCafe.ipa }

      - uses: actions/upload-artifact@v4
        with: { name: ios-release, path: ios/build/ParadiseCafe.ipa, retention-days: 7, if-no-files-found: error }

  # ───────────────────────── JOB 3a · E2E smoke - Android emulator ─────────────────────────
  e2e-android:
    name: E2E smoke (Android)
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: actions/download-artifact@v4
        with: { name: android-release, path: artifacts }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION="$MAESTRO_VERSION" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run smoke flows on the signed release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r artifacts/apk/release/app-release.apk
            maestro test .maestro --include-tags=smoke --format=junit --output=maestro-android.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-android-report, path: "maestro-android.xml\n~/.maestro/tests", retention-days: 7, if-no-files-found: ignore }

  # ───────────────────────── JOB 3b · E2E smoke - iOS simulator ─────────────────────────
  e2e-ios:
    name: E2E smoke (iOS)
    needs: build-ios
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
      - run: npm ci --no-audit --no-fund
      - run: cd ios && bundle exec pod install --deployment
      - name: Build unsigned simulator app (Release config, same JS bundle pipeline)
        run: |
          xcodebuild -workspace ios/ParadiseCafe.xcworkspace -scheme ParadiseCafe -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/sim-build CODE_SIGNING_ALLOWED=NO -quiet
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION="$MAESTRO_VERSION" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot simulator, install, run smoke flows
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 15" | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$(find ios/sim-build -name 'ParadiseCafe.app' | head -n1)"
          maestro --platform ios --device "$UDID" test .maestro --include-tags=smoke --format=junit --output=maestro-ios.xml \
            --exclude-tags=network   # airplane-mode flow is Android-only
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-ios-report, path: maestro-ios.xml, retention-days: 7, if-no-files-found: ignore }

  # ───────────────────────── JOB 4 · Gated distribution ─────────────────────────
  deploy-android:
    name: Distribute Android (${{ inputs.environment }})
    needs: [e2e-android]
    if: github.event_name == 'workflow_dispatch' && inputs.distribute && inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers / wait timer / branch restrictions are configured on this GitHub Environment.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - uses: actions/download-artifact@v4
        with: { name: android-release, path: artifacts }
      - name: Firebase App Distribution
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          AAB_PATH: artifacts/bundle/release/app-release.aab
        run: |
          umask 077; echo "$FIREBASE_SA_B64" | base64 --decode > "$RUNNER_TEMP/firebase.json"
          FIREBASE_CREDENTIALS_FILE="$RUNNER_TEMP/firebase.json" bundle exec fastlane android firebase
          rm -f "$RUNNER_TEMP/firebase.json"
      - name: Google Play internal track
        if: inputs.environment == 'production'
        env:
          PLAY_SA_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_BASE64 }}
          AAB_PATH: artifacts/bundle/release/app-release.aab
        run: |
          umask 077; echo "$PLAY_SA_B64" | base64 --decode > "$RUNNER_TEMP/play.json"
          PLAY_JSON_KEY_FILE="$RUNNER_TEMP/play.json" bundle exec fastlane android play_internal
          rm -f "$RUNNER_TEMP/play.json"

  deploy-ios:
    name: Distribute iOS - TestFlight (${{ inputs.environment }})
    needs: [e2e-ios]
    if: github.event_name == 'workflow_dispatch' && inputs.distribute && inputs.platform != 'android'
    runs-on: macos-14
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - uses: actions/download-artifact@v4
        with: { name: ios-release, path: artifacts }
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IPA_PATH: artifacts/ParadiseCafe.ipa
        run: |
          umask 077; echo "$ASC_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc.p8" bundle exec fastlane ios testflight
          rm -f "$RUNNER_TEMP/asc.p8"

  deploy-backend:
    name: Deploy Supabase backend (${{ inputs.environment }})
    needs: [quality, backend-tests]
    if: github.event_name == 'workflow_dispatch' && inputs.distribute
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same approval gate as the app deployments (required reviewers on the GitHub Environment).
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: supabase/setup-cli@v1
        with: { version: latest }   # pin to an exact version once you have validated one
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Dry-run migrations
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}" }
        run: supabase db push --dry-run
      - name: Apply migrations
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}" }
        run: supabase db push
      - name: Set Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          OTP_HASH_PEPPER: ${{ secrets.OTP_HASH_PEPPER }}
        run: supabase secrets set FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" OTP_HASH_PEPPER="$OTP_HASH_PEPPER"
      - name: Deploy Edge Functions
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          supabase functions deploy otp-guard --no-verify-jwt
          supabase functions deploy auth-sync --no-verify-jwt
